# Counterfactual sweep config: Periodic Delivery Batching (high thinking, gemini-3.8-flash).
# Tests whether natural workflow boundaries outperform blind periodic every-4-steps batching.
# Pass via: AGENT_CONFIG=configs/variants/delivery_timing_periodic_high.yaml RUN_SUFFIX=delivery-periodic tools/run.sh coop flash_10 10 --git
agent:
  cost_limit: 40.0
  step_counter: true
  delivery_timing: true
  delivery_max_hold_steps: 4
  delivery_boundary_mode: periodic

model:
  model_kwargs:
    drop_params: true
    thinkingConfig:
      thinkingLevel: high
      includeThoughts: true
