# Variant config: "saturation" run to find which tasks solo can solve given ample budget.
# 500 steps, compaction at 128K tokens, step counter, medium thinking, $40 per-agent cost cap,
# and containers kept alive for 10 hours (the 2-hour default would end long runs early).
# Pass via: AGENT_CONFIG=configs/variants/saturation_medium_128k.yaml RUN_SUFFIX=saturation-medium-128k tools/run.sh solo ...
agent:
  cost_limit: 40.0
  step_limit: 500
  compaction_token_trigger: 128000
  step_counter: true

environment:
  container_timeout: "10h"

model:
  model_kwargs:
    drop_params: true
    thinkingConfig:
      thinkingLevel: medium
      includeThoughts: true
